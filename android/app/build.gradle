    compileSdk 35

    defaultConfig {
        applicationId 'sa.bas.daily'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '1.5'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.13.0'
}
