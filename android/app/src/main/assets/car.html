<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مدير صيانة السيارة</title>
<style>
:root{--bg:#071426;--card:#0f223a;--card2:#132c49;--ink:#f7fbff;--muted:#a9bdd1;--line:#274663;--blue:#22a7ff;--teal:#18d0bd;--gold:#ffc44d;--green:#39d98a;--red:#ff6868;--orange:#ff9b42}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(160deg,#071426,#0b2440 60%,#06283c);color:var(--ink);min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:30;background:#071426eF;backdrop-filter:blur(10px);border-bottom:1px solid #24415e;padding:12px 14px}.title{font-size:20px;font-weight:900}.sub{font-size:12px;color:var(--muted);margin-top:3px}.wrap{max-width:900px;margin:auto;padding:12px 12px 96px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:8px 0 12px;position:sticky;top:69px;z-index:20;background:#071426e8;padding:7px 0}.tab{border:1px solid var(--line);background:#0d1f35;color:#c7d9e9;padding:10px 5px;border-radius:14px;font-weight:800;font-size:12px}.tab.on{background:linear-gradient(135deg,#126dba,#159d9e);color:white;border-color:#35b8ff}.page{display:none}.page.on{display:block}
.card{background:linear-gradient(160deg,#102640,#0d1e33);border:1px solid #264867;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 8px 25px #0004}.hero{background:linear-gradient(135deg,#113b69,#0a766e);border-color:#278fb1}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}@media(max-width:650px){.grid2,.grid3{grid-template-columns:1fr}.tabs{grid-template-columns:repeat(5,1fr)}.tab{font-size:11px;padding:9px 2px}}
h2,h3{margin:0 0 10px}.muted{color:var(--muted);font-size:12px}.big{font-size:28px;font-weight:900}.pill{display:inline-flex;align-items:center;gap:4px;padding:6px 9px;border-radius:999px;background:#193a58;color:#d8e9f8;font-size:12px;font-weight:800}.good{background:#123d32;color:#7bf0b0}.warn{background:#4a3416;color:#ffd67f}.bad{background:#4c2027;color:#ff9ea9}
.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:900;color:white;background:#25486a}.primary{background:linear-gradient(135deg,#1c8ef0,#12b3a7)}.success{background:#168858}.danger{background:#9a3444}.gold{background:#9a6911}.wide{width:100%}
label{display:block;color:#c9d9e8;font-size:12px;margin:8px 0 5px}input,select,textarea{width:100%;border:1px solid #31506d;background:#07192b;color:white;border-radius:11px;padding:10px;outline:none}textarea{min-height:70px;resize:vertical}.mini{font-size:11px;color:#9fb5ca}.divider{height:1px;background:#274663;margin:12px 0}
.vehicle{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid #2a4b68;border-radius:15px;padding:11px;margin-top:8px;background:#0c1d31}.vehicle.sel{border-color:#2de0c7;box-shadow:0 0 0 1px #2de0c744}.caricon{font-size:30px}.vname{font-weight:900}.vmeta{font-size:12px;color:#a9bfd2;margin-top:3px}
.item{border:1px solid #274a67;border-radius:15px;padding:11px;margin-top:9px;background:#0b1d31}.itemhead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.itemname{font-weight:900}.due{font-size:12px;margin-top:5px;color:#b7cada}.progress{height:7px;background:#071421;border-radius:99px;overflow:hidden;margin-top:8px}.bar{height:100%;background:linear-gradient(90deg,#2bd49f,#26a7ff)}.bar.warn{background:linear-gradient(90deg,#ffbf47,#ff8a3d)}.bar.bad{background:linear-gradient(90deg,#ff815d,#ff4757)}
.check{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;border-bottom:1px solid #24425e;padding:10px 0}.check:last-child{border-bottom:0}.ck{width:24px;height:24px}.official{font-size:10px;padding:3px 6px;border-radius:999px;background:#154f6c;color:#92eaff}.practical{font-size:10px;padding:3px 6px;border-radius:999px;background:#3a3314;color:#ffe39a}
.stat{background:#0c2036;border:1px solid #294965;border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:#a9bdd1}.empty{text-align:center;padding:25px 10px;color:#8da6bd}.history{border-right:4px solid #238fd4;padding:8px 11px;margin:9px 0;background:#0c1e32;border-radius:12px}.cost{color:#ffd46d;font-weight:900}
.notice{background:#132f45;border:1px solid #2e5875;padding:10px 12px;border-radius:13px;line-height:1.8;color:#d5e7f7;font-size:12px}.fab{position:fixed;left:17px;bottom:18px;z-index:50;border:0;border-radius:18px;padding:13px 16px;background:linear-gradient(135deg,#1e8fee,#16c3a9);color:#fff;font-weight:900;box-shadow:0 10px 30px #0008}
.dialog{position:fixed;inset:0;background:#000a;z-index:100;display:none;align-items:flex-end;justify-content:center}.dialog.show{display:flex}.sheet{background:#0d2239;border:1px solid #335773;border-radius:24px 24px 0 0;padding:16px;width:min(900px,100%);max-height:88vh;overflow:auto}.sheet h2{margin-top:0}.x{border:0;background:#263f55;color:white;border-radius:10px;padding:7px 11px}
</style>
</head>
<body>
<header><div class="title">🚙 مدير صيانة السيارة</div><div class="sub">الصيانة الدورية • سجل الخدمات • الاستعداد للفحص الفني الدوري</div></header>
<div class="wrap">
<div class="tabs">
<button class="tab on" data-page="home">الرئيسية</button><button class="tab" data-page="maint">الصيانة</button><button class="tab" data-page="inspection">الفحص</button><button class="tab" data-page="history">السجل</button><button class="tab" data-page="settings">الإعدادات</button>
</div>
<section id="home" class="page on"><div id="homeBox"></div></section>
<section id="maint" class="page"><div id="maintBox"></div></section>
<section id="inspection" class="page"><div id="inspectionBox"></div></section>
<section id="history" class="page"><div id="historyBox"></div></section>
<section id="settings" class="page"><div id="settingsBox"></div></section>
</div>
<button class="fab" onclick="openService()">＋ تسجيل صيانة</button>
<div class="dialog" id="dialog"><div class="sheet" id="sheet"></div></div>
<input type="file" id="restoreFile" accept="application/json,.json" hidden>
<script>
const KEY='burghash_car_care_v1';
const DEFAULT_ITEMS=[
{id:'engineOil',name:'زيت المحرك',km:10000,months:12,cat:'محرك'},
{id:'oilFilter',name:'فلتر الزيت',km:10000,months:12,cat:'محرك'},
{id:'airFilter',name:'فلتر هواء المحرك',km:20000,months:12,cat:'فلاتر'},
{id:'cabinFilter',name:'فلتر المكيف',km:20000,months:12,cat:'فلاتر'},
{id:'tireRotate',name:'تدوير الإطارات',km:10000,months:6,cat:'إطارات'},
{id:'tireCheck',name:'فحص ضغط وحالة الإطارات',km:0,months:1,cat:'إطارات'},
{id:'brakes',name:'فحص الفرامل والفحمات',km:10000,months:6,cat:'فرامل'},
{id:'brakeFluid',name:'سائل الفرامل',km:40000,months:24,cat:'سوائل'},
{id:'coolant',name:'سائل التبريد',km:50000,months:24,cat:'سوائل'},
{id:'transmission',name:'زيت ناقل الحركة',km:60000,months:36,cat:'نقل الحركة'},
{id:'diff',name:'زيت الدفرنس / الدفرنسات',km:50000,months:24,cat:'دفع رباعي'},
{id:'transfer',name:'زيت علبة التحويل 4×4',km:50000,months:24,cat:'دفع رباعي'},
{id:'spark',name:'البواجي',km:60000,months:48,cat:'محرك'},
{id:'battery',name:'فحص البطارية',km:0,months:12,cat:'كهرباء'},
{id:'wipers',name:'مساحات الزجاج',km:0,months:12,cat:'سلامة'}
];
const INSPECTION=[
{id:'tires',name:'الإطارات: الحالة والنقشة وعدم وجود تلف ظاهر',tag:'official'},
{id:'brakes',name:'الفرامل وكفاءة التوقف',tag:'official'},
{id:'lights',name:'الأنوار والإشارات وأنوار الفرامل',tag:'official'},
{id:'exhaust',name:'نظام العادم وعدم وجود تسريب أو خلل واضح',tag:'official'},
{id:'glass',name:'الزجاج الأمامي وخلو مجال الرؤية من كسر مؤثر',tag:'practical'},
{id:'wipers',name:'المساحات ورشاش الماء',tag:'practical'},
{id:'mirrors',name:'المرايا مثبتة وسليمة',tag:'practical'},
{id:'belts',name:'أحزمة الأمان تعمل وتغلق بشكل صحيح',tag:'practical'},
{id:'horn',name:'البوق يعمل',tag:'practical'},
{id:'steering',name:'الدركسون والتعليق بدون لعب أو أصوات غير طبيعية',tag:'practical'},
{id:'leaks',name:'لا توجد تسريبات زيوت أو سوائل ظاهرة',tag:'practical'},
{id:'body',name:'الهيكل والشاصي دون تلف أو تعديل جوهري',tag:'practical'},
{id:'plate',name:'اللوحات واضحة ومثبتة',tag:'practical'}
];
function blank(){return{vehicles:[],services:[],customItems:[],inspectionChecks:{},settings:{soonKm:1000,soonDays:30}}}
let db=load();
function load(){try{return Object.assign(blank(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return blank()}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));renderAll()}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function dateISO(d=new Date()){return d.toISOString().slice(0,10)}
function addMonths(date,months){if(!date||!months)return null;let d=new Date(date+'T12:00:00');d.setMonth(d.getMonth()+Number(months));return d}
function daysBetween(a,b){return Math.ceil((b-a)/86400000)}
function currentVehicle(){let idv=db.settings.currentVehicle;let v=db.vehicles.find(x=>x.id===idv);if(!v&&db.vehicles.length){v=db.vehicles[0];db.settings.currentVehicle=v.id;localStorage.setItem(KEY,JSON.stringify(db))}return v||null}
function allItems(v){return [...DEFAULT_ITEMS,...db.customItems].filter(x=>!x.disabled).map(it=>{let o=(v?.maintenance||{})[it.id]||{};return {...it,...o}})}
function stateFor(v,it){if(!v)return{state:'none',text:'—',pct:0};let kmDue=it.km&&it.lastKm!==undefined&&it.lastKm!==''?Number(it.lastKm)+Number(it.km):null;let dateDue=it.months&&it.lastDate?addMonths(it.lastDate,it.months):null;let remKm=kmDue!==null?kmDue-Number(v.odometer||0):null;let remDays=dateDue?daysBetween(new Date(),dateDue):null;let overdue=(remKm!==null&&remKm<=0)||(remDays!==null&&remDays<=0);let soon=(remKm!==null&&remKm<=Number(db.settings.soonKm||1000))||(remDays!==null&&remDays<=Number(db.settings.soonDays||30));let text=[];if(kmDue!==null)text.push('عند '+kmDue.toLocaleString('ar-SA')+' كم');if(dateDue)text.push(dateDue.toISOString().slice(0,10));let pct=0;if(it.km&&it.lastKm!==undefined&&it.lastKm!=='')pct=Math.max(0,Math.min(100,100-(Math.max(0,remKm)/it.km*100)));return{state:overdue?'bad':soon?'warn':'good',text:text.join(' • ')||'لم تُسجل صيانة سابقة',remKm,remDays,pct}}
function nav(page){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id===page));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.page===page))}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>nav(b.dataset.page));
function renderAll(){renderHome();renderMaint();renderInspection();renderHistory();renderSettings()}
function renderHome(){let v=currentVehicle(),box=document.getElementById('homeBox');if(!v){box.innerHTML=`<div class="card hero"><h2>ابدأ بإضافة سيارتك</h2><div class="muted">يسجل التطبيق العداد والصيانات والفحص الفني لكل سيارة بشكل مستقل.</div><button class="btn primary wide" style="margin-top:12px" onclick="openVehicle()">＋ إضافة سيارة</button></div>`;return}
let items=allItems(v).map(it=>({it,st:stateFor(v,it)})),bad=items.filter(x=>x.st.state==='bad').length,warn=items.filter(x=>x.st.state==='warn').length;let exp=v.inspectionExpiry?new Date(v.inspectionExpiry+'T12:00:00'):null,days=exp?daysBetween(new Date(),exp):null;box.innerHTML=`
<div class="card hero"><div class="row between"><div><div class="muted">السيارة الحالية</div><div class="big">${esc(v.name)}</div><div class="muted">${esc(v.model||'')} ${v.year?'• '+esc(v.year):''} ${v.plate?'• '+esc(v.plate):''}</div></div><div class="caricon">🚙</div></div><div class="divider"></div><div class="grid3"><div class="stat"><b>${Number(v.odometer||0).toLocaleString('ar-SA')}</b><span>عداد كم</span></div><div class="stat"><b>${bad}</b><span>مستحق الآن</span></div><div class="stat"><b>${warn}</b><span>قريب</span></div></div><button class="btn wide" style="margin-top:10px" onclick="updateOdo()">تحديث العداد</button></div>
<div class="card"><h3>الفحص الفني الدوري</h3>${days===null?'<div class="notice">لم تسجل تاريخ انتهاء الفحص بعد.</div>':`<div class="row between"><div><div class="muted">الانتهاء</div><b>${esc(v.inspectionExpiry)}</b></div><span class="pill ${days<0?'bad':days<=30?'warn':'good'}">${days<0?'منتهي منذ '+Math.abs(days)+' يوم':'متبقي '+days+' يوم'}</span></div>`}<button class="btn primary wide" style="margin-top:10px" onclick="nav('inspection')">فتح تجهيز الفحص</button></div>
<div class="card"><h3>الأولوية الآن</h3>${items.filter(x=>x.st.state!=='good').slice(0,5).map(x=>itemSmall(x.it,x.st)).join('')||'<div class="notice">لا توجد صيانة مسجلة كمستحقة حسب البيانات الحالية.</div>'}</div>`}
function itemSmall(it,st){return `<div class="item"><div class="itemhead"><div><div class="itemname">${esc(it.name)}</div><div class="due">${esc(st.text)}</div></div><span class="pill ${st.state}">${st.state==='bad'?'مستحق':st.state==='warn'?'قريب':'سليم'}</span></div></div>`}
function renderMaint(){let v=currentVehicle(),box=document.getElementById('maintBox');if(!v){box.innerHTML='<div class="empty">أضف سيارة أولاً.</div>';return}let items=allItems(v);box.innerHTML=`<div class="card"><div class="row between"><div><h2>جدول الصيانة</h2><div class="muted">الفترات الافتراضية إرشادية وقابلة للتعديل؛ اتبع كتيب الشركة إذا اختلف.</div></div><button class="btn" onclick="openCustomItem()">＋ بند</button></div></div>${items.map(it=>{let st=stateFor(v,it);return `<div class="item"><div class="itemhead"><div><div class="itemname">${esc(it.name)}</div><div class="mini">${esc(it.cat||'')} • ${it.km?Number(it.km).toLocaleString('ar-SA')+' كم':''}${it.km&&it.months?' أو ':''}${it.months?it.months+' شهر':''}</div></div><span class="pill ${st.state}">${st.state==='bad'?'مستحق':st.state==='warn'?'قريب':'متابعة'}</span></div><div class="due">التالي: ${esc(st.text)}</div><div class="progress"><div class="bar ${st.state}" style="width:${st.pct}%"></div></div><div class="row" style="margin-top:9px"><button class="btn success" onclick="openService('${it.id}')">تمت الصيانة</button><button class="btn" onclick="editItem('${it.id}')">تعديل الفترة</button></div></div>`}).join('')}`}
function renderInspection(){let v=currentVehicle(),box=document.getElementById('inspectionBox');if(!v){box.innerHTML='<div class="empty">أضف سيارة أولاً.</div>';return}let ck=db.inspectionChecks[v.id]||{},done=INSPECTION.filter(x=>ck[x.id]).length;box.innerHTML=`<div class="card hero"><h2>تجهيز الفحص الفني الدوري</h2><div class="muted">القائمة تساعدك قبل الذهاب للفحص وليست بديلاً عن معايير مركز الفحص.</div><div class="grid2" style="margin-top:10px"><div><label>تاريخ آخر فحص</label><input type="date" value="${v.lastInspection||''}" onchange="setV('lastInspection',this.value)"></div><div><label>تاريخ انتهاء الفحص</label><input type="date" value="${v.inspectionExpiry||''}" onchange="setV('inspectionExpiry',this.value)"></div></div></div>
<div class="card"><div class="row between"><h3>قائمة ما قبل الفحص</h3><span class="pill">${done}/${INSPECTION.length}</span></div>${INSPECTION.map(x=>`<label class="check"><input class="ck" type="checkbox" ${ck[x.id]?'checked':''} onchange="toggleCheck('${x.id}',this.checked)"><span>${esc(x.name)}</span><span class="${x.tag==='official'?'official':'practical'}">${x.tag==='official'?'مذكور رسميًا':'تجهيز عملي'}</span></label>`).join('')}<button class="btn wide" style="margin-top:10px" onclick="resetChecks()">إعادة ضبط القائمة</button></div>
<div class="card"><h3>الخدمات الرسمية</h3><div class="notice">حجز موعد الفحص يتطلب رخصة سير المركبة أو البطاقة الجمركية. النتيجة تصل بعد الفحص، وفي حال عدم الاجتياز توجد فرصتا إعادة فحص خلال 14 يوم عمل وفق منصة الفحص الفني الدوري.</div><div class="grid2" style="margin-top:10px"><button class="btn primary" onclick="openWeb('https://pti.saso.gov.sa/apt/')">حجز موعد رسمي</button><button class="btn" onclick="openWeb('https://saso.gov.sa/ar/eservices/Pages/MainEServicesDetails.aspx?serviceid=430')">التحقق من حالة الفحص</button></div></div>`}
function renderHistory(){let v=currentVehicle(),box=document.getElementById('historyBox');if(!v){box.innerHTML='<div class="empty">أضف سيارة أولاً.</div>';return}let a=db.services.filter(x=>x.vehicleId===v.id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));let total=a.reduce((s,x)=>s+Number(x.cost||0),0);box.innerHTML=`<div class="card"><div class="grid2"><div class="stat"><b>${a.length}</b><span>عمليات مسجلة</span></div><div class="stat"><b>${total.toLocaleString('ar-SA')} ر.س</b><span>إجمالي التكلفة</span></div></div></div><div class="card"><h3>سجل الصيانة</h3>${a.map(x=>`<div class="history"><div class="row between"><b>${esc(x.itemName)}</b><span class="cost">${x.cost?Number(x.cost).toLocaleString('ar-SA')+' ر.س':''}</span></div><div class="mini">${esc(x.date)} • ${Number(x.odometer||0).toLocaleString('ar-SA')} كم ${x.workshop?'• '+esc(x.workshop):''}</div>${x.notes?`<div class="due">${esc(x.notes)}</div>`:''}<button class="btn danger" style="margin-top:7px;padding:6px 9px" onclick="delService('${x.id}')">حذف</button></div>`).join('')||'<div class="empty">لا توجد عمليات صيانة مسجلة بعد.</div>'}</div>`}
function renderSettings(){let box=document.getElementById('settingsBox'),v=currentVehicle();box.innerHTML=`<div class="card"><div class="row between"><h2>السيارات</h2><button class="btn primary" onclick="openVehicle()">＋ إضافة</button></div>${db.vehicles.map(x=>`<div class="vehicle ${v&&v.id===x.id?'sel':''}" onclick="selectVehicle('${x.id}')"><div class="row"><div class="caricon">🚘</div><div><div class="vname">${esc(x.name)}</div><div class="vmeta">${esc(x.model||'')} ${x.year?'• '+esc(x.year):''} • ${Number(x.odometer||0).toLocaleString('ar-SA')} كم</div></div></div><button class="btn" onclick="event.stopPropagation();openVehicle('${x.id}')">تعديل</button></div>`).join('')||'<div class="empty">لا توجد سيارات.</div>'}</div>
<div class="card"><h3>التنبيه المبكر</h3><div class="grid2"><div><label>قبل الاستحقاق بالكيلومترات</label><input type="number" value="${db.settings.soonKm||1000}" onchange="db.settings.soonKm=Number(this.value);save()"></div><div><label>قبل الاستحقاق بالأيام</label><input type="number" value="${db.settings.soonDays||30}" onchange="db.settings.soonDays=Number(this.value);save()"></div></div></div>
<div class="card"><h3>النسخ الاحتياطي</h3><div class="grid2"><button class="btn success" onclick="backup()">تصدير JSON</button><button class="btn" onclick="document.getElementById('restoreFile').click()">استعادة JSON</button></div></div>
<div class="card"><h3>ملاحظة</h3><div class="notice">فترات الصيانة الافتراضية وضعت كنقطة بداية عامة. عدّلها حسب دليل سيارتك ونوع الزيت وظروف الاستخدام، خصوصًا سيارات الدفع الرباعي والاستخدام الصحراوي.</div></div>`}
function openVehicle(vid=''){let v=db.vehicles.find(x=>x.id===vid)||{id:id(),name:'',model:'',year:'',plate:'',odometer:0,lastInspection:'',inspectionExpiry:'',maintenance:{}};openSheet(`<div class="row between"><h2>${vid?'تعديل السيارة':'إضافة سيارة'}</h2><button class="x" onclick="closeSheet()">✕</button></div><label>اسم مختصر</label><input id="vName" value="${esc(v.name)}" placeholder="مثال: BJ40"><label>الموديل</label><input id="vModel" value="${esc(v.model)}" placeholder="مثال: BAIC BJ40C"><div class="grid2"><div><label>السنة</label><input id="vYear" value="${esc(v.year)}"></div><div><label>العداد الحالي كم</label><input type="number" id="vOdo" value="${Number(v.odometer||0)}"></div></div><label>اللوحة - اختياري</label><input id="vPlate" value="${esc(v.plate)}"><div class="grid2"><div><label>آخر فحص</label><input type="date" id="vLastInsp" value="${v.lastInspection||''}"></div><div><label>انتهاء الفحص</label><input type="date" id="vExp" value="${v.inspectionExpiry||''}"></div></div><button class="btn primary wide" style="margin-top:12px" onclick="saveVehicle('${v.id}','${vid?'1':'0'}')">حفظ</button>${vid?`<button class="btn danger wide" style="margin-top:8px" onclick="deleteVehicle('${v.id}')">حذف السيارة</button>`:''}`)}
function saveVehicle(vid,exists){let old=db.vehicles.find(x=>x.id===vid);let obj=old||{id:vid,maintenance:{}};Object.assign(obj,{name:document.getElementById('vName').value.trim()||'سيارتي',model:document.getElementById('vModel').value.trim(),year:document.getElementById('vYear').value.trim(),odometer:Number(document.getElementById('vOdo').value||0),plate:document.getElementById('vPlate').value.trim(),lastInspection:document.getElementById('vLastInsp').value,inspectionExpiry:document.getElementById('vExp').value});if(!old)db.vehicles.push(obj);db.settings.currentVehicle=vid;closeSheet();save()}
function deleteVehicle(vid){if(!confirm('حذف السيارة وسجلها؟'))return;db.vehicles=db.vehicles.filter(x=>x.id!==vid);db.services=db.services.filter(x=>x.vehicleId!==vid);delete db.inspectionChecks[vid];if(db.settings.currentVehicle===vid)db.settings.currentVehicle='';closeSheet();save()}
function selectVehicle(vid){db.settings.currentVehicle=vid;save()}
function setV(k,val){let v=currentVehicle();if(!v)return;v[k]=val;save()}
function updateOdo(){let v=currentVehicle();if(!v)return;let n=prompt('العداد الحالي بالكيلومترات',v.odometer||0);if(n!==null&&!isNaN(Number(n))){v.odometer=Number(n);save()}}
function openService(itemId=''){let v=currentVehicle();if(!v){alert('أضف سيارة أولاً');return}let items=allItems(v),it=items.find(x=>x.id===itemId)||items[0];openSheet(`<div class="row between"><h2>تسجيل صيانة</h2><button class="x" onclick="closeSheet()">✕</button></div><label>البند</label><select id="sItem">${items.map(x=>`<option value="${x.id}" ${x.id===itemId?'selected':''}>${esc(x.name)}</option>`).join('')}</select><div class="grid2"><div><label>التاريخ</label><input type="date" id="sDate" value="${dateISO()}"></div><div><label>العداد كم</label><input type="number" id="sOdo" value="${v.odometer||0}"></div></div><div class="grid2"><div><label>التكلفة ر.س</label><input type="number" id="sCost" value="0"></div><div><label>الورشة</label><input id="sShop" placeholder="اختياري"></div></div><label>ملاحظات / نوع الزيت أو القطعة</label><textarea id="sNotes"></textarea><button class="btn success wide" style="margin-top:12px" onclick="saveService()">حفظ الصيانة وتحديث الموعد التالي</button>`)}
function saveService(){let v=currentVehicle(),iid=document.getElementById('sItem').value,it=allItems(v).find(x=>x.id===iid);let d=document.getElementById('sDate').value,odo=Number(document.getElementById('sOdo').value||0);v.odometer=Math.max(Number(v.odometer||0),odo);v.maintenance=v.maintenance||{};v.maintenance[iid]=Object.assign(v.maintenance[iid]||{},{lastDate:d,lastKm:odo,km:it.km,months:it.months});db.services.push({id:id(),vehicleId:v.id,itemId:iid,itemName:it.name,date:d,odometer:odo,cost:Number(document.getElementById('sCost').value||0),workshop:document.getElementById('sShop').value.trim(),notes:document.getElementById('sNotes').value.trim()});closeSheet();save()}
function editItem(iid){let v=currentVehicle(),it=allItems(v).find(x=>x.id===iid),o=v.maintenance?.[iid]||{};openSheet(`<div class="row between"><h2>${esc(it.name)}</h2><button class="x" onclick="closeSheet()">✕</button></div><div class="grid2"><div><label>كل كم كيلومتر</label><input type="number" id="eKm" value="${it.km||0}"></div><div><label>كل كم شهر</label><input type="number" id="eMo" value="${it.months||0}"></div></div><div class="grid2"><div><label>آخر عداد للصيانة</label><input type="number" id="eLastKm" value="${o.lastKm??''}"></div><div><label>تاريخ آخر صيانة</label><input type="date" id="eLastDate" value="${o.lastDate||''}"></div></div><button class="btn primary wide" style="margin-top:12px" onclick="saveItemEdit('${iid}')">حفظ</button>`)}
function saveItemEdit(iid){let v=currentVehicle();v.maintenance=v.maintenance||{};v.maintenance[iid]=Object.assign(v.maintenance[iid]||{},{km:Number(document.getElementById('eKm').value||0),months:Number(document.getElementById('eMo').value||0),lastKm:document.getElementById('eLastKm').value===''?'':Number(document.getElementById('eLastKm').value),lastDate:document.getElementById('eLastDate').value});closeSheet();save()}
function openCustomItem(){openSheet(`<div class="row between"><h2>بند صيانة جديد</h2><button class="x" onclick="closeSheet()">✕</button></div><label>اسم البند</label><input id="cName"><label>التصنيف</label><input id="cCat" placeholder="مثال: ملحقات"><div class="grid2"><div><label>كل كم كيلومتر</label><input type="number" id="cKm" value="0"></div><div><label>كل كم شهر</label><input type="number" id="cMo" value="12"></div></div><button class="btn primary wide" style="margin-top:12px" onclick="saveCustom()">إضافة</button>`)}
function saveCustom(){let n=document.getElementById('cName').value.trim();if(!n)return alert('اكتب اسم البند');db.customItems.push({id:'custom_'+id(),name:n,cat:document.getElementById('cCat').value.trim()||'مخصص',km:Number(document.getElementById('cKm').value||0),months:Number(document.getElementById('cMo').value||0)});closeSheet();save()}
function toggleCheck(cid,val){let v=currentVehicle();db.inspectionChecks[v.id]=db.inspectionChecks[v.id]||{};db.inspectionChecks[v.id][cid]=val;save()}
function resetChecks(){let v=currentVehicle();db.inspectionChecks[v.id]={};save()}
function delService(sid){if(!confirm('حذف هذا السجل؟'))return;db.services=db.services.filter(x=>x.id!==sid);save()}
function openWeb(url){try{if(window.Android&&Android.openWeb){Android.openWeb(url);return}}catch(e){}window.location.href=url}
function backup(){let txt=JSON.stringify({format:'CarMaintenanceManagerV1',exportedAt:new Date().toISOString(),data:db},null,2),name='Car_Maintenance_Backup_'+dateISO()+'.json';try{if(window.Android&&Android.saveText){Android.saveText(name,txt);return}}catch(e){}let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;a.click()}
document.getElementById('restoreFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let o=JSON.parse(await f.text());db=o.data||o;if(!db.vehicles||!db.services)throw 0;save();alert('تمت الاستعادة')}catch(err){alert('ملف غير صالح')}e.target.value=''}
function openSheet(html){document.getElementById('sheet').innerHTML=html;document.getElementById('dialog').classList.add('show')}
function closeSheet(){document.getElementById('dialog').classList.remove('show')}
document.getElementById('dialog').onclick=e=>{if(e.target.id==='dialog')closeSheet()}
renderAll();
</script></body></html>
